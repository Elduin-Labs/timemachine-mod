plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "timemachine" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Real in-game verification: `./gradlew runClientGameTest` boots a client, builds a world, turns
// the dial and checks the past actually arrived. See src/gametest/java/com/timemachine/test.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "timemachine-test"
        enableClientGameTests = true
        eula = true
    }
}

// Configured after fabricApi so the generated clientGameTest run gets it too: dumps transformed
// classes to run/.mixin.out, so mixin application can be inspected rather than assumed.
loom.runs.configureEach {
    vmArg "-Dmixin.debug.export=true"
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
